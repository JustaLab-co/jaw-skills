name: check-tools

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-tools.mjs
      - name: Pin is the latest CLI release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pinned=$(grep -o '@jaw.id/cli@[0-9.]*' jaw-cli/SKILL.md | head -1 | cut -d@ -f3)
          latest=$(npm view @jaw.id/cli version)
          if [ "$pinned" != "$latest" ]; then
            echo "::error::jaw-cli/SKILL.md pins @jaw.id/cli@$pinned, npm has $latest. Bump the pin and run the check."
            exit 1
          fi
